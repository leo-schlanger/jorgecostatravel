    <!-- Structured Data: TravelAgency -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "Jorge Pessoa e Costa Travel",

      "url": "https://jorgecostatravel.vercel.app",
      "telephone": "+351931362788",
      "image": "https://jorgecostatravel.vercel.app/og-image.jpg",
      "logo": "https://jorgecostatravel.vercel.app/logo.jpg",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Cascais",
        "addressRegion": "Lisboa",
        "addressCountry": "PT"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "38.6979",
        "longitude": "-9.4215"
      },
      "sameAs": [
        "https://www.instagram.com/jorgepessoacostatravel/"
      ],
      "priceRange": "€€",
      "openingHoursSpecification": {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"],
        "opens": "09:00",
        "closes": "20:00"
      },
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "5.0",
        "reviewCount": "150"
      },
      "makesOffer": [
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "Passagens Aéreas",
            "description": "Voos nacionais e internacionais com tarifas exclusivas negociadas"
          }
        },
        {
          "@type": "Offer",
          "itemOffered": {
            "@type": "Service",
            "name": "Cotação de Voos",
            "description": "Comparação e cotação gratuita de voos em menos de 24 horas"
          }
        }
      ]
    }
    </script>

    <!-- Structured Data: Person -->
    <script type="application/ld+json">
    {

    </script>

    <!-- Structured Data: FAQ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "Porquê comprar passagens aéreas através de um consultor?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Tenho acesso a tarifas negociadas que não estão disponíveis nos motores de busca. Além do preço, ofereço apoio personalizado na escolha do voo, condições de cancelamento mais flexíveis e assistência caso surja qualquer problema. O serviço de pesquisa e cotação é gratuito."
          }
        },
        {
          "@type": "Question",
          "name": "Os preços são mesmo mais baratos do que online?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim, na grande maioria dos casos. Trabalho com tarifas consolidadas e negociadas através da rede APM Viagens. Em média, os nossos clientes poupam até 23% no valor total da passagem."
          }
        },
        {
          "@type": "Question",
          "name": "Quanto tempo demora a receber a cotação?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No máximo 24 horas. Na maioria dos casos, respondo no mesmo dia. Basta enviar o destino, datas e número de passageiros via WhatsApp."
          }
        },
        {
          "@type": "Question",
          "name": "E se precisar de alterar ou cancelar o voo?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Trato de tudo por si. Ao comprar comigo, as condições de alteração e cancelamento são frequentemente mais flexíveis. Em caso de imprevisto, contacte-me por WhatsApp e resolvo o mais rápido possível."
          }
        },
        {
          "@type": "Question",
          "name": "Quais são as formas de pagamento?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Aceito transferência bancária, MB Way e cartão de crédito. Em alguns casos, é possível pagar em prestações."
          }
        }
      ]
    }
    </script>
